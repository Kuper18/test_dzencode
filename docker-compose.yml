services:
  api:
    container_name: server
    build:
      context: ./server
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./server:/app
      - media_files:/app/media
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
        restart: true

  db:
    image: mysql:8.4
    container_name: mysql-db
    restart: always
    ports:
      - "3306:3306"
    env_file:
      - ./server/.env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 10s
      retries: 10
      start_period: 40s
      timeout: 10s

  frontend:
    container_name: client
    build:
      context: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    env_file:
      - ./client/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - api

  realtime:
    container_name: realtime
    build:
      context: ./realtime
    ports:
      - "8001:8001"
    restart: unless-stopped

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  mysql_data:
  media_files:
