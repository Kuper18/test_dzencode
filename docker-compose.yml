services:
  api:
    container_name: server
    build:
      context: ./server
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./server:/app
      - media_files:/app/media
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
        restart: true

  db:
    image: postgres:18-alpine3.24
    container_name: postgres-db
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - ./server/.env
    volumes:
      - app_db:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  frontend:
    container_name: client
    build:
      context: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    env_file:
      - ./client/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - api

  realtime:
    container_name: realtime
    build:
      context: ./realtime
    ports:
      - "3001:3001"
    restart: unless-stopped

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  app_db:
  media_files:
